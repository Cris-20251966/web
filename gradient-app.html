<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Degradados - GradientCris</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #6366f1;
        --secondary: #a855f7;
        --accent: #ec4899;
        --dark-bg: #0f172a;
        --card-bg: #1e293b;
        --light-text: #f1f5f9;
        --muted-text: #94a3b8;
        --border: #334155;
      }

      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1f35 100%);
        color: var(--light-text);
        min-height: 100vh;
        overflow-x: hidden;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }

      /* ===== HEADER ===== */
      .header {
        text-align: center;
        margin-bottom: 40px;
        animation: slideDown 0.6s ease;
      }

      .header h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 10px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--secondary),
          var(--accent)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .header p {
        color: var(--muted-text);
        font-size: 1rem;
      }

      /* ===== MAIN LAYOUT ===== */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 30px;
        margin-bottom: 40px;
      }

      @media (max-width: 1024px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ===== PREVIEW ===== */
      .preview-section {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 30px;
        animation: fadeIn 0.8s ease 0.2s backwards;
      }

      .preview-box {
        width: 100%;
        height: 300px;
        border-radius: 16px;
        margin-bottom: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        transition: all 0.3s ease;
        border: 2px solid var(--border);
      }

      .preview-box:hover {
        transform: translateY(-5px);
        box-shadow: 0 30px 80px rgba(99, 102, 241, 0.3);
      }

      .gradient-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 20px;
      }

      .info-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        padding: 15px;
        border-radius: 12px;
        transition: all 0.3s ease;
      }

      .info-item:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--primary);
      }

      .info-label {
        font-size: 0.8rem;
        color: var(--muted-text);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }

      .info-value {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.95rem;
        color: var(--light-text);
        word-break: break-all;
      }

      /* ===== CONTROL PANEL ===== */
      .control-panel {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 25px;
        height: fit-content;
        animation: fadeIn 0.8s ease 0.3s backwards;
        position: sticky;
        top: 20px;
      }

      .control-title {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted-text);
        margin-bottom: 20px;
        font-weight: 600;
      }

      .control-group {
        margin-bottom: 25px;
      }

      .control-label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 10px;
        color: var(--light-text);
        font-weight: 500;
      }

      .button-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 15px;
      }

      .btn {
        padding: 10px 16px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        color: var(--light-text);
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.3s ease;
        text-transform: capitalize;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .btn:hover {
        background: rgba(99, 102, 241, 0.2);
        border-color: var(--primary);
        transform: translateY(-2px);
      }

      .btn.active {
        background: var(--primary);
        border-color: var(--primary);
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
      }

      .btn.danger {
        background: rgba(239, 68, 68, 0.1);
        border-color: #ef4444;
        color: #fca5a5;
      }

      .btn.danger:hover {
        background: rgba(239, 68, 68, 0.2);
      }

      input[type="range"] {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--light-text);
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      }

      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--light-text);
        cursor: pointer;
        border: none;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      }

      .range-value {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
        font-size: 0.8rem;
        color: var(--muted-text);
      }

      input[type="color"] {
        width: 100%;
        height: 50px;
        border: 2px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        transition: border-color 0.3s ease;
      }

      input[type="color"]:hover {
        border-color: var(--primary);
      }

      /* ===== COLOR STOPS ===== */
      .colors-section {
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid var(--border);
      }

      .color-stop {
        display: grid;
        grid-template-columns: 50px 1fr 60px 40px;
        gap: 12px;
        align-items: center;
        margin-bottom: 15px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        border-radius: 12px;
        animation: slideIn 0.3s ease;
      }

      .color-preview {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        border: 2px solid var(--border);
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .color-preview:hover {
        transform: scale(1.05);
      }

      .color-hex {
        font-family: "JetBrains Mono", monospace;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--light-text);
        font-size: 0.9rem;
      }

      .color-stop-buttons {
        display: flex;
        gap: 8px;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        color: var(--light-text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        font-size: 0.9rem;
      }

      .icon-btn:hover {
        background: rgba(99, 102, 241, 0.2);
        border-color: var(--primary);
        transform: scale(1.1);
      }

      /* ===== PRESET SECTION ===== */
      .presets-section {
        margin-top: 60px;
      }

      .presets-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 25px;
        color: var(--light-text);
      }

      .presets-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
      }

      .preset-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        animation: fadeIn 0.6s ease;
      }

      .preset-card:hover {
        transform: translateY(-8px);
        border-color: var(--primary);
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
      }

      .preset-preview {
        width: 100%;
        height: 120px;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      .preset-info {
        padding: 15px;
      }

      .preset-name {
        font-weight: 600;
        margin-bottom: 8px;
      }

      .preset-code {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        color: var(--muted-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ===== COLOR LIBRARY ===== */
      .color-library-section {
        margin-top: 60px;
        padding-bottom: 60px;
      }

      .color-categories {
        display: grid;
        gap: 40px;
      }

      .color-category {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 25px;
        animation: fadeIn 0.6s ease;
      }

      .category-title {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 20px;
        color: var(--light-text);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .color-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
      }

      .color-item {
        background: rgba(255, 255, 255, 0.02);
        border: 2px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        animation: slideIn 0.3s ease;
      }

      .color-item:hover {
        transform: translateY(-4px);
        border-color: var(--primary);
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
      }

      .color-swatch {
        width: 100%;
        height: 80px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 8px;
        transition: all 0.3s ease;
        position: relative;
      }

      .color-item:hover .color-swatch {
        height: 100px;
      }

      .color-copy-hint {
        position: absolute;
        top: 5px;
        right: 5px;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .color-item:hover .color-copy-hint {
        opacity: 1;
      }

      .color-details {
        padding: 12px;
        text-align: center;
      }

      .color-name {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--light-text);
        margin-bottom: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .color-codes {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: var(--muted-text);
      }

      .color-hex-small {
        display: block;
        margin-bottom: 4px;
      }

      .color-rgb-small {
        display: block;
        font-size: 0.7rem;
      }

      /* ===== UTILITIES ===== */
      .copy-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: var(--primary);
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s ease;
        margin-top: 15px;
      }

      .copy-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      }

      .copy-btn.copied {
        background: #10b981;
      }

      .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #10b981;
        color: white;
        padding: 15px 25px;
        border-radius: 8px;
        font-weight: 500;
        animation: slideUp 0.4s ease;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        z-index: 1000;
      }

      /* ===== ANIMATIONS ===== */
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 768px) {
        .header h1 {
          font-size: 2rem;
        }

        .main-grid {
          grid-template-columns: 1fr;
        }

        .control-panel {
          position: static;
        }

        .gradient-info {
          grid-template-columns: 1fr;
        }

        .presets-grid {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }

        .preview-box {
          height: 250px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>🎨 Generador de Degradados</h1>
        <p>Crea hermosos degradados y obtén el código CSS listo para usar</p>
      </div>

      <!-- Main Content -->
      <div class="main-grid">
        <!-- Left: Preview & Info -->
        <div class="preview-section">
          <div class="preview-box" id="previewBox"></div>

          <div class="gradient-info">
            <div class="info-item">
              <div class="info-label">Tipo de Degradado</div>
              <div class="info-value" id="typeInfo">Linear (135deg)</div>
            </div>
            <div class="info-item">
              <div class="info-label">Ángulo</div>
              <div class="info-value" id="angleInfo">135°</div>
            </div>
          </div>

          <div class="gradient-info">
            <div class="info-item" style="grid-column: 1/-1">
              <div class="info-label">CSS Code</div>
              <div class="info-value" id="cssCode">
                background: linear-gradient(135deg, #6366f1, #a855f7);
              </div>
            </div>
          </div>

          <button class="copy-btn" id="copyBtn">
            <span>📋</span> Copiar CSS
          </button>
        </div>

        <!-- Right: Controls -->
        <div class="control-panel">
          <div class="control-title">⚙️ Controles</div>

          <!-- Gradient Type -->
          <div class="control-group">
            <label class="control-label">Tipo de Degradado</label>
            <div class="button-group">
              <button class="btn active" id="linearBtn" data-type="linear">
                Linear
              </button>
              <button class="btn" id="radialBtn" data-type="radial">
                Radial
              </button>
            </div>
          </div>

          <!-- Angle Control -->
          <div class="control-group" id="angleControl">
            <label class="control-label">Ángulo</label>
            <input
              type="range"
              id="angleSlider"
              min="0"
              max="360"
              value="135"
              step="5"
            />
            <div class="range-value">
              <span id="angleValue">135°</span>
              <button class="icon-btn" id="resetAngleBtn">↻</button>
            </div>
          </div>

          <!-- Color Controls -->
          <div class="control-group">
            <label class="control-label">Primer Color</label>
            <input type="color" id="color1" value="#6366f1" />
          </div>

          <div class="control-group">
            <label class="control-label">Segundo Color</label>
            <input type="color" id="color2" value="#a855f7" />
          </div>

          <!-- Action Buttons -->
          <div class="button-group">
            <button class="btn" id="addColorBtn">➕ Agregar Color</button>
            <button class="btn danger" id="resetBtn">🔄 Resetear</button>
          </div>

          <!-- Colors Section -->
          <div class="colors-section" id="colorsSection"></div>
        </div>
      </div>

      <!-- Presets Section -->
      <div class="presets-section">
        <h2 class="presets-title">🎭 Degradados Predefinidos</h2>
        <div class="presets-grid" id="presetsGrid"></div>
      </div>

      <!-- Color Library Section -->
      <div class="color-library-section">
        <h2 class="presets-title">🎨 Librería de Colores</h2>
        <div class="color-categories" id="colorLibraryContainer"></div>
      </div>
    </div>

    <div class="toast" id="toast" style="display: none"></div>

      // ===== FUNCTIONS =====
      function updateGradient() {
        const css = generateCSS();
        const previewBox = document.getElementById("previewBox");
        previewBox.style.background = css;

        document.getElementById("cssCode").textContent = css + ";";
        document.getElementById("typeInfo").textContent =
          gradientState.type === "linear"
            ? `Linear (${gradientState.angle}deg)`
            : "Radial";
        document.getElementById("angleInfo").textContent =
          gradientState.angle + "°";
      }

      function generateCSS() {
        const colorStops = gradientState.colors
          .map((c) => `${c.hex} ${c.stop}%`)
          .join(", ");

        if (gradientState.type === "linear") {
          return `linear-gradient(${gradientState.angle}deg, ${colorStops})`;
        } else {
          return `radial-gradient(circle, ${colorStops})`;
        }
      }

      function renderColorStops() {
        const section = document.getElementById("colorsSection");
        section.innerHTML = "";

        if (gradientState.colors.length > 2) {
          section.innerHTML +=
            '<div class="control-label">Colores Adicionales</div>';
        }

        gradientState.colors.forEach((color, index) => {
          if (index > 1) {
            const div = document.createElement("div");
            div.className = "color-stop";
            div.innerHTML = `
                        <div class="color-preview" style="background: ${color.hex};" onclick="document.getElementById('extraColor${index}').click();"></div>
                        <input type="color" id="extraColor${index}" value="${color.hex}" style="display: none;" onchange="updateExtraColor(${index}, this.value)">
                        <span class="color-hex">${color.hex}</span>
                        <button class="icon-btn danger" onclick="removeColor(${index})">🗑️</button>
                    `;
            section.appendChild(div);
          }
        });
      }

      function updateExtraColor(index, value) {
        gradientState.colors[index].hex = value;
        updateGradient();
      }

      function removeColor(index) {
        gradientState.colors.splice(index, 1);
        updateGradient();
        renderColorStops();
      }

      function copyToClipboard() {
        const css = `background: ${generateCSS()};`;
        navigator.clipboard.writeText(css).then(() => {
          showToast("¡Copiado al portapapeles!");
          const btn = document.getElementById("copyBtn");
          btn.classList.add("copied");
          setTimeout(() => btn.classList.remove("copied"), 2000);
        });
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.style.display = "block";
        setTimeout(() => {
          toast.style.display = "none";
        }, 3000);
      }

      function loadPreset(preset) {
        gradientState.type = preset.type;
        gradientState.angle = preset.angle;
        gradientState.colors = preset.colors.map((hex, i) => ({
          id: String(i),
          hex: hex,
          stop: Math.round((i / (preset.colors.length - 1)) * 100),
        }));

        document
          .getElementById("linearBtn")
          .classList.toggle("active", preset.type === "linear");
        document
          .getElementById("radialBtn")
          .classList.toggle("active", preset.type === "radial");
        document.getElementById("angleSlider").value = preset.angle;
        document.getElementById("angleValue").textContent = preset.angle + "°";
        document.getElementById("angleControl").style.display =
          preset.type === "linear" ? "block" : "none";

        updateGradient();
        renderColorStops();
        showToast(`Degradado "${preset.name}" cargado`);
      }

      function renderPresets() {
        const grid = document.getElementById("presetsGrid");
        presets.forEach((preset) => {
          const card = document.createElement("div");
          card.className = "preset-card";
          const colors = preset.colors.join(", ");
          const gradient =
            preset.type === "linear"
              ? `linear-gradient(${preset.angle}deg, ${colors})`
              : `radial-gradient(circle, ${colors})`;

          card.innerHTML = `
                    <div class="preset-preview" style="background: ${gradient};"></div>
                    <div class="preset-info">
                        <div class="preset-name">${preset.name}</div>
                        <div class="preset-code">${gradient}</div>
                    </div>
                `;
          card.onclick = () => loadPreset(preset);
          grid.appendChild(card);
        });
      }

      function renderColorLibrary() {
        const container = document.getElementById("colorLibraryContainer");
        container.innerHTML = "";

        Object.entries(colorLibrary).forEach(([categoryName, colors]) => {
          const categoryDiv = document.createElement("div");
          categoryDiv.className = "color-category";

          const titleDiv = document.createElement("div");
          titleDiv.className = "category-title";
          titleDiv.textContent = "🎨 " + categoryName;

          const gridDiv = document.createElement("div");
          gridDiv.className = "color-grid";

          colors.forEach((color) => {
            const colorItem = document.createElement("div");
            colorItem.className = "color-item";

            colorItem.innerHTML = `
              <div class="color-swatch" style="background-color: ${color.hex};">
                <div class="color-copy-hint">Click para copiar</div>
              </div>
              <div class="color-details">
                <div class="color-name">${color.name}</div>
                <div class="color-codes">
                  <span class="color-hex-small">${color.hex}</span>
                  <span class="color-rgb-small">rgb(${color.rgb})</span>
                </div>
              </div>
            `;

            colorItem.addEventListener("click", () => {
              navigator.clipboard.writeText(color.hex);
              showToast(`✓ ${color.hex} copiado`);
            });

            gridDiv.appendChild(colorItem);
          });

          categoryDiv.appendChild(titleDiv);
          categoryDiv.appendChild(gridDiv);
          container.appendChild(categoryDiv);
        });
      }

      // ===== EVENT LISTENERS =====
      document
        .getElementById("linearBtn")
        .addEventListener("click", function () {
          gradientState.type = "linear";
          document.getElementById("angleControl").style.display = "block";
          this.classList.add("active");
          document.getElementById("radialBtn").classList.remove("active");
          updateGradient();
        });

      document
        .getElementById("radialBtn")
        .addEventListener("click", function () {
          gradientState.type = "radial";
          document.getElementById("angleControl").style.display = "none";
          this.classList.add("active");
          document.getElementById("linearBtn").classList.remove("active");
          updateGradient();
        });

      document
        .getElementById("angleSlider")
        .addEventListener("input", function () {
          gradientState.angle = parseInt(this.value);
          document.getElementById("angleValue").textContent =
            gradientState.angle + "°";
          updateGradient();
        });

      document
        .getElementById("resetAngleBtn")
        .addEventListener("click", function () {
          gradientState.angle = 135;
          document.getElementById("angleSlider").value = 135;
          document.getElementById("angleValue").textContent = "135°";
          updateGradient();
        });

      document.getElementById("color1").addEventListener("change", function () {
        gradientState.colors[0].hex = this.value;
        updateGradient();
      });

      document.getElementById("color2").addEventListener("change", function () {
        gradientState.colors[1].hex = this.value;
        updateGradient();
      });

      document
        .getElementById("addColorBtn")
        .addEventListener("click", function () {
          const newColor = {
            id: String(gradientState.colors.length),
            hex: "#ff0000",
            stop: 50,
          };
          gradientState.colors.push(newColor);
          updateGradient();
          renderColorStops();
          showToast("Color nuevo agregado");
        });

      document
        .getElementById("resetBtn")
        .addEventListener("click", function () {
          gradientState = {
            type: "linear",
            angle: 135,
            colors: [
              { id: "1", hex: "#6366f1", stop: 0 },
              { id: "2", hex: "#a855f7", stop: 100 },
            ],
          };
          document.getElementById("color1").value = "#6366f1";
          document.getElementById("color2").value = "#a855f7";
          document.getElementById("angleSlider").value = 135;
          document.getElementById("linearBtn").classList.add("active");
          document.getElementById("radialBtn").classList.remove("active");
          updateGradient();
          renderColorStops();
          showToast("Degradado reseteado");
        });

      document
        .getElementById("copyBtn")
        .addEventListener("click", copyToClipboard);

      // ===== INITIALIZE =====
      updateGradient();
      renderColorStops();
      renderPresets();
      renderColorLibrary();
    </script>
